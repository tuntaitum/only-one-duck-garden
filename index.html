<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143c33" />
    <title>only one duck — garden</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="garden" aria-label="Only One Duck garden">
      <div class="sun-haze"></div>
      <div class="mountain mountain-a"></div><div class="mountain mountain-b"></div>
      <div class="forest forest-back"></div><div class="forest forest-front"></div>
      <div class="flora" aria-hidden="true"></div>
      <div class="water"><div class="water-light"></div><div class="water-rings"></div></div>
      <div class="lily-pads" aria-hidden="true"></div>
      <div class="garden-grain" aria-hidden="true"></div>
      <header>
        <a href="/" aria-label="only one duck garden home">only one duck<span>.</span>garden</a>
        <p>do not disturb the duck</p>
      </header>
      <p class="garden-whisper">there is more than one way in</p>
      <a class="lotus destination" href="/lotus" aria-label="Enter through the white lotus" data-name="useful things">
        <span class="lotus-shadow"></span>
        <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><b></b><em></em>
      </a>
      <a class="butterfly destination rover" href="/butterflies" aria-label="Visit small experiments" data-name="little experiments"><i></i><i></i><i></i><i></i><em></em></a>
      <a class="dragonfly destination rover" href="/dragonflies" aria-label="Visit quick things" data-name="quick things"><i></i><i></i><b></b><em></em></a>
      <a class="duck destination rover" href="/duck" aria-label="Speak to the only duck" data-name="the only duck"><span class="duck-body"></span><span class="duck-neck"></span><span class="duck-head"></span><span class="duck-bill"></span><span class="duck-eye"></span><span class="duck-wing"></span><i class="ripple ripple-a"></i><i class="ripple ripple-b"></i><em></em></a>
      <div class="fireflies" aria-hidden="true"></div>
      <footer>© a garden with exactly one duck</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
